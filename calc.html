<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Yönlendiriliyorsunuz... | Klinik Takip</title>
    <meta content="0; url=/calc/" http-equiv="refresh" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var target = '/calc/';
        try {
          if (window.location.replace) {
            window.location.replace(target);
          } else {
            window.location.href = target;
          }
        } catch (err) {
          window.location.href = target;
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background-color: #f8fafc;
        color: #334155;
      }
      .redirect-wrap {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .redirect-card {
        max-width: 420px;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 20px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      }
      .redirect-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        border-radius: 9999px;
        border: 1px solid #c7d2fe;
        background: #eef2ff;
        padding: 4px 12px;
        color: #4338ca;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .redirect-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6366f1;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      h1 {
        font-size: 18px;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: #64748b;
      }
      a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="redirect-wrap">
      <div class="redirect-card">
        <div class="redirect-badge">
          <span class="redirect-dot"></span>
          <span>Yönlendirme</span>
        </div>
        <h1>Hesaplayıcıya Yönlendiriliyorsunuz</h1>
        <p>
          Otomatik olarak yönlendirilmediyseniz
          <a href="/calc/">buraya tıklayın</a>
          .
        </p>
      </div>
    </div>
  </body>
</html>
